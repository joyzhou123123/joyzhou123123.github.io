/* V9: top-to-top phone tap, actual hand gestures, restored compute flow. */
.shortcut-stage{grid-template-columns:360px 48px 1fr;gap:24px}
.shortcut-source.share-source,.shortcut-source.hand-source{height:300px;display:block;padding:0}
.share-source .phone{position:absolute;left:22px;top:82px;width:94px;height:180px;margin:0;z-index:3;transform-origin:50% 0%;will-change:transform}
.share-source .shortcut-device,.hand-source .shortcut-device{position:absolute;left:229px;top:104px;z-index:2}
/* Hand-only scenes center the device, fingertip, contact and caption at x=180. */
.hand-source .shortcut-device{left:131px}
.hand-source .tap-contact{left:180px}
.shortcut-source .shortcut-device img{height:167px}
.share-source>p,.hand-source>p{bottom:0;font-size:13px;white-space:nowrap}
.hand-source .shortcut-hand{position:absolute;left:138px;top:35px;width:72px;height:72px;display:block;margin:0;z-index:3;transform-origin:50% 100%}
.hand-source .shortcut-hand svg{display:block;width:72px;height:72px;transform:rotate(180deg);fill:var(--bg)}
.hand-source .shortcut-hand>span{position:absolute;left:82px;top:22px;font-size:13px;font-weight:600;color:var(--blue);white-space:nowrap}
.tap-contact{position:absolute;left:278px;top:118px;width:14px;height:14px;margin:-7px 0 0 -7px;border-radius:50%;border:2px solid #6b97f2;opacity:0;pointer-events:none;z-index:4}
.share-source.is-phone-tap .phone{animation:phone-top-tap 1.8s cubic-bezier(.4,0,.2,1) both}
.share-source.is-phone-tap .tap-contact{animation:phone-tap-contact 1.8s ease-out both}
.hand-source.is-double-tap .shortcut-hand{animation:hand-double-tap 1.4s ease-in-out both}
.hand-source.is-double-tap .tap-contact{animation:double-contact 1.4s ease-out both}
.hand-source.is-holding .shortcut-hand{animation:hand-press-hold 2.2s ease-in-out both}
.hand-source.is-holding .tap-contact{animation:hold-contact 2.2s linear both}
.shortcut-canvas.tap-preview .photo-gallery,.shortcut-canvas.tap-preview .shortcut-result{animation:phone-share-reveal 1.8s ease-out both}
.shortcut-canvas.double-preview .capture-outline,.shortcut-canvas.double-preview .shortcut-result{animation:capture-reveal 1.4s ease-out both}
.shortcut-canvas.hold-preview .call-mic{animation:mute-reveal 2.2s ease-out both}
.shortcut-action .button[aria-disabled=true]{cursor:progress;background:#5477e6}

 0%,10%{transform:translate(0,0) rotate(0deg)}
 36%{transform:translate(224.5px,-22.8px) rotate(105deg)}

 65%{transform:translate(224.5px,-22.8px) rotate(105deg)}
 90%,100%{transform:translate(0,0) rotate(0deg)}
}
